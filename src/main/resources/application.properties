# Nama Aplikasi dan Port
spring.application.name=67travel-be
server.port=9090

# Konfigurasi Database MySQL
# Ganti 'db_travel' dengan nama database yang kamu buat di phpMyAdmin/MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_travel?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Konfigurasi JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Konfigurasi JWT (Wajib ada karena dipakai di JwtConfig.java)
